plugins {
    id 'com.android.application'
}

android {
    namespace "org.main.babaylan_tales"
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.main.babaylan_tales"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-Wall -std=c++17 -D__ANDROID_USE_LIBCXX=1"
                arguments "-DANDROID_STL=c++_shared",
                        "-DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
                .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets {
            main {
                jniLibs.srcDir 'libs'
                assets.srcDirs = ["${projectDir}/../../SDLTest/assets"]
            }
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
